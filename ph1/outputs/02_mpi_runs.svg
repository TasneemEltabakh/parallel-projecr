<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="JetBrains Mono, Consolas, monospace" font-size="13">
  <defs>
    <linearGradient id="bar2" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#3a3f4b"/>
      <stop offset="1" stop-color="#2a2f3a"/>
    </linearGradient>
    <filter id="sh2" x="-2%" y="-2%" width="110%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="880" height="560" fill="#f5f3ed"/>
  <g filter="url(#sh2)">
    <rect x="20" y="20" width="840" height="520" rx="9" fill="#1c2329"/>
    <rect x="20" y="20" width="840" height="32" rx="9" fill="url(#bar2)"/>
    <circle cx="40" cy="36" r="6" fill="#ff5f57"/>
    <circle cx="60" cy="36" r="6" fill="#febc2e"/>
    <circle cx="80" cy="36" r="6" fill="#28c840"/>
    <text x="440" y="40" fill="#cbd2dc" font-size="11" text-anchor="middle">parallel_mpi.exe sweep — N = 1, 2, 4, 8</text>
  </g>
  <g fill="#d4d8df">
    <!-- n=1 -->
    <text x="40" y="80" fill="#7a8492">── mpiexec -n 1 ─────────────────────────────────────────────────────</text>
    <text x="40" y="104"><tspan fill="#7eb3c4">PS</tspan> <tspan fill="#9bb88a">G:\…\Project&gt;</tspan> mpiexec -n 1 .\bin\parallel_mpi.exe .\data\data.bin</text>
    <text x="40" y="128"><tspan fill="#7a8492">[mpi]</tspan> rank0 loaded 2049280 doubles from .\data\data.bin</text>
    <text x="40" y="152"><tspan fill="#7a8492">[mpi]</tspan> size=<tspan fill="#d6a06b">1</tspan>  n=2049280  avg=<tspan fill="#9bb88a">1.091615037</tspan>  min=0.076  max=11.122</text>
    <text x="40" y="176"><tspan fill="#7a8492">[mpi]</tspan> elapsed_ms=<tspan fill="#d6a06b">1.006</tspan></text>

    <!-- n=2 -->
    <text x="40" y="216" fill="#7a8492">── mpiexec -n 2 ─────────────────────────────────────────────────────</text>
    <text x="40" y="240"><tspan fill="#7a8492">[mpi]</tspan> rank0 loaded 2049280 doubles from .\data\data.bin</text>
    <text x="40" y="264"><tspan fill="#7a8492">[mpi]</tspan> size=<tspan fill="#d6a06b">2</tspan>  n=2049280  avg=<tspan fill="#9bb88a">1.091615037</tspan>  min=0.076  max=11.122</text>
    <text x="40" y="288"><tspan fill="#7a8492">[mpi]</tspan> elapsed_ms=<tspan fill="#d6a06b">0.609</tspan>  <tspan fill="#9bb88a">◀ fastest run (5.22× speedup)</tspan></text>

    <!-- n=4 -->
    <text x="40" y="328" fill="#7a8492">── mpiexec -n 4 ─────────────────────────────────────────────────────</text>
    <text x="40" y="352"><tspan fill="#7a8492">[mpi]</tspan> rank0 loaded 2049280 doubles from .\data\data.bin</text>
    <text x="40" y="376"><tspan fill="#7a8492">[mpi]</tspan> size=<tspan fill="#d6a06b">4</tspan>  n=2049280  avg=<tspan fill="#9bb88a">1.091615037</tspan>  min=0.076  max=11.122</text>
    <text x="40" y="400"><tspan fill="#7a8492">[mpi]</tspan> elapsed_ms=<tspan fill="#d6a06b">0.711</tspan></text>

    <!-- n=8 -->
    <text x="40" y="440" fill="#7a8492">── mpiexec -n 8 ─────────────────────────────────────────────────────</text>
    <text x="40" y="464"><tspan fill="#7a8492">[mpi]</tspan> rank0 loaded 2049280 doubles from .\data\data.bin</text>
    <text x="40" y="488"><tspan fill="#7a8492">[mpi]</tspan> size=<tspan fill="#d6a06b">8</tspan>  n=2049280  avg=<tspan fill="#9bb88a">1.091615037</tspan>  min=0.076  max=11.122</text>
    <text x="40" y="512"><tspan fill="#7a8492">[mpi]</tspan> elapsed_ms=<tspan fill="#d6a06b">0.886</tspan></text>
  </g>
